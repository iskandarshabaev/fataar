import org.gradle.api.DefaultTask
import org.gradle.api.file.RegularFileProperty
import org.gradle.api.provider.Property
import org.gradle.api.tasks.*
import java.util.zip.*

abstract class CorruptGeneratedPayload extends DefaultTask {
    @InputFile @PathSensitive(PathSensitivity.NONE) abstract RegularFileProperty getInputAar()
    @OutputFile abstract RegularFileProperty getOutputAar()
    @Input abstract Property<String> getScenario()

    static Map<String, byte[]> read(byte[] bytes) {
        def entries = new TreeMap<String, byte[]>()
        new ZipInputStream(new ByteArrayInputStream(bytes)).withCloseable { zip ->
            for (def entry = zip.nextEntry; entry != null; entry = zip.nextEntry) {
                if (!entry.directory) entries[entry.name] = zip.readAllBytes()
            }
        }
        entries
    }
    static byte[] write(Map<String, byte[]> entries) {
        def buffer = new ByteArrayOutputStream()
        new ZipOutputStream(buffer).withCloseable { zip ->
            entries.each { name, bytes ->
                def entry = new ZipEntry(name); entry.time = 315532800000L
                zip.putNextEntry(entry); zip.write(bytes); zip.closeEntry()
            }
        }
        buffer.toByteArray()
    }
    @TaskAction void corrupt() {
        def entries = read(inputAar.get().asFile.bytes)
        switch (scenario.get()) {
            case 'aidl-conflict':
                entries['aidl/com/fataar/fixtures/aidl/FixturePacket.aidl'] = 'package com.fataar.fixtures.aidl; parcelable FixturePacket; // conflict'.getBytes('UTF-8')
                break
            case 'invalid-binding-metadata':
                entries['data-binding/com.fataar.fixtures.databindingleft-setter_store.json'] = '{broken'.getBytes('UTF-8')
                break
            case 'missing-binding-metadata':
                entries.remove('data-binding/com.fataar.fixtures.databindingleft-br.bin')
                break
            case 'missing-binding-class':
                def classes = read(entries['classes.jar'])
                classes.remove('com/fataar/fixtures/databindingleft/databinding/FixtureDataBindingLeftBindingImpl.class')
                entries['classes.jar'] = write(classes)
                break
            default: throw new IllegalArgumentException(scenario.get())
        }
        def output = outputAar.get().asFile; output.parentFile.mkdirs(); output.bytes = write(entries)
    }
}

gradle.beforeProject { project ->
    def scenario = project.providers.gradleProperty('fatAar.payloadScenario').orNull
    def target = scenario == 'aidl-conflict' ? ':fixtures:view-binding' : ':fixtures:data-binding-left'
    if (scenario != null && project.path == target) {
        project.pluginManager.withPlugin('com.android.library') {
            def components = project.extensions.getByName('androidComponents')
            def aarType = components.class.classLoader.loadClass('com.android.build.api.artifact.SingleArtifact$AAR').getField('INSTANCE').get(null)
            components.onVariants(components.selector().withBuildType('release'), { variant ->
                def transform = project.tasks.register('corruptGeneratedReleasePayload', CorruptGeneratedPayload) {
                    it.scenario.set(scenario)
                }
                variant.artifacts.use(transform).wiredWithFiles({ it.inputAar }, { it.outputAar }).toTransform(aarType)
            })
        }
    }
}
