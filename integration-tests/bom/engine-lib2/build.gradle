plugins { id 'java-library'; id 'maven-publish' }
version = '2'
java { toolchain { languageVersion = JavaLanguageVersion.of(17) } }
publishing {
 publications { library(MavenPublication) { from components.java; artifactId = 'engine-lib' } }
 repositories { maven { name = 'Family'; url = rootProject.layout.buildDirectory.dir('family-repository') } }
}
